<div id="modal-partilhar" class="modal" style="display:none; position:fixed; z-index:1001; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.6); align-items:center; justify-content:center;">
  <div class="modal-conteudo" style="background:#1a1a2e; padding:24px; border-radius:12px; max-width:420px; width:92%; border:1px solid #333; color:#eee;">
    <h3 style="margin-top:0;">Partilhar recurso</h3>
    <p style="font-size:0.9em; color:#aaa;">Escreva o email do utilizador (login) com quem deseja partilhar.</p>
    <form id="form-partilhar" onsubmit="event.preventDefault(); enviarPartilha();">
      <input type="hidden" id="partilhar-tipo" value="tarefa">
      <input type="hidden" id="partilhar-id" value="">
      <div style="margin-bottom:12px;">
        <label for="partilhar-email" style="display:block; font-size:0.8em; margin-bottom:4px;">Email do utilizador</label>
        <input id="partilhar-email" type="email" placeholder="utilizador@exemplo.com" style="width:100%; padding:8px; border-radius:6px; border:1px solid #555; background:#222; color:#eee;" required>
      </div>
      <div style="margin-bottom:12px;">
        <label style="display:block; font-size:0.8em; margin-bottom:4px;">Nível de acesso</label>
        <label style="margin-right:12px; font-size:0.85em;"><input type="radio" name="partilhar-nivel" value="leitura" checked style="margin-right:4px;"> Leitura</label>
        <label style="font-size:0.85em;"><input type="radio" name="partilhar-nivel" value="edicao" style="margin-right:4px;"> Edição</label>
      </div>
      <div style="display:flex; gap:8px;">
        <button type="submit" style="flex:1; padding:8px; border-radius:6px; border:none; background:#4caf50; color:#fff; cursor:pointer;">Enviar</button>
        <button type="button" onclick="fecharModalPartilhar()" style="flex:1; padding:8px; border-radius:6px; border:1px solid #777; background:#333; color:#eee; cursor:pointer;">Cancelar</button>
      </div>
    </form>
    <div id="partilhar-mensagem" style="margin-top:10px; font-size:0.85em; min-height:1.2em;"></div>
  </div>
</div>

<script>
function abrirModalPartilhar(tipo, id) {
  document.getElementById('partilhar-tipo').value = tipo;
  document.getElementById('partilhar-id').value = id;
  document.getElementById('partilhar-email').value = '';
  document.getElementById('partilhar-mensagem').textContent = '';
  const m = document.getElementById('modal-partilhar');
  m.style.display = 'flex';
  m.style.zIndex = '1001';
}
function fecharModalPartilhar() {
  document.getElementById('modal-partilhar').style.display = 'none';
}
function enviarPartilha() {
  const tipo = document.getElementById('partilhar-tipo').value;
  const id = document.getElementById('partilhar-id').value;
  const email = document.getElementById('partilhar-email').value.trim();
  const nivel = document.querySelector('input[name="partilhar-nivel"]:checked').value;
  const msg = document.getElementById('partilhar-mensagem');
  msg.style.color = '#aaa';
  msg.textContent = 'Enviando...';
  fetch('/partilha/' + tipo + '/' + id, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({email: email, nivel: nivel})
  })
  .then(r => r.json().then(data => ({ok: r.ok, status: r.status, data})))
  .then(({ok, status, data}) => {
    if (ok) {
      msg.style.color = '#4caf50';
      msg.textContent = 'Partilha enviada com sucesso.';
      setTimeout(fecharModalPartilhar, 1200);
    } else {
      msg.style.color = '#ff6b6b';
      msg.textContent = data.erro || ('Erro ' + status);
    }
  })
  .catch(() => { msg.style.color = '#ff6b6b'; msg.textContent = 'Erro de rede.'; });
}
</script>
